<!DOCTYPE html>
<html>
<head>
    <title>Your Cart | Mahfuj Store</title>
    <link rel="stylesheet" href="/styles/cart.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="logo">
        <span class="brand">Online Store</span>
    </div>

    <div class="nav-right">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="login.html">Login</a>
    </div>
</nav>

<h2 class="section-title">Shopping Cart</h2>

<div class="cart-container">

    <!-- Cart Item -->
    <div class="cart-item">
        <img src="/Exp_4/Images/phone.jpg" alt="Phone">

        <div class="cart-details">
            <h3>Samsung Galaxy Smartphone</h3>
            <p>₹20,000</p>

            <div class="quantity">
                <button>-</button>
                <span>1</span>
                <button>+</button>
            </div>

            <button class="remove-btn">Remove</button>
        </div>
    </div>

    <!-- Price Summary -->
    <div class="cart-summary">
        <h3>Price Details</h3>
        <p>Price: ₹20,000</p>
        <p>Delivery: ₹0</p>
        <hr>
        <h3>Total: ₹20,000</h3>
        <button class="checkout-btn">Proceed to Checkout</button>
    </div>

</div>

</body>
</html>
