<!DOCTYPE html>
<html>
<head>
    <title>Online Store</title>
    <link rel="stylesheet" href="/styles/cart.css">
</head>
<body>

<nav class="navbar">
      <div class="logo">
            <a href="index.html"> <span class="brand">Online Store </span></a>
    </div>
    
    <div class="search-box">
        <input type="text" placeholder="Search for Products, Brands and More">
    </div>

    <div class="nav-right">
        <a href="login.html">Login</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
    </div>

</nav>


<h2 class="section-title">My Cart</h2>

<div class="cart-container">

    <!-- Product 1 -->
    <div class="cart-item">
        <img src="Images/motorola.jpg" alt="Phone">

        <div class="cart-details">
            <h3>Moto G96 5G (256GB)</h3>
            <p class="cart-price">₹18,999</p>

            <div class="quantity">
                <label>Qty:</label>
                <input type="number" value="1" min="1">
            </div>

            <button class="remove-btn">Remove</button>
        </div>
    </div>

    <!-- Product 2 -->
    <div class="cart-item">
        <img src="/Images/watch.jpg" alt="Watch">

        <div class="cart-details">
            <h3>Smart Watch</h3>
            <p class="cart-price">₹3,500</p>

            <div class="quantity">
                <label>Qty:</label>
                <input type="number" value="1" min="1">
            </div>

            <button class="remove-btn">Remove</button>
        </div>
    </div>

</div>

<!-- Total Section -->
<div class="cart-summary">
    <h3>Total Amount: ₹22,499</h3>
    <button class="checkout-btn">Proceed to Checkout</button>
</div>

</body>
</html>
