<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator Hub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    overflow:hidden;
}

/* Glass Card */
.container{
    width:90%;
    max-width:900px;
    padding:50px;
    border-radius:25px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    box-shadow:0 15px 40px rgba(0,0,0,0.4);
    text-align:center;
    animation: fadeIn 1.2s ease;
}

.container h1{
    color:#fff;
    font-size:42px;
    margin-bottom:15px;
    letter-spacing:1px;
}

.container p{
    color:#ddd;
    font-size:18px;
    margin-bottom:45px;
}

/* Button Box */
.links{
    display:flex;
    justify-content:center;
    gap:35px;
    flex-wrap:wrap;
}

/* Buttons */
.links a{
    text-decoration:none;
    padding:18px 40px;
    min-width:250px;
    border-radius:50px;
    font-size:20px;
    font-weight:600;
    color:#fff;
    position:relative;
    overflow:hidden;
    transition:0.4s ease;
    letter-spacing:0.5px;
}

/* Simple */
.simple{
    background: linear-gradient(135deg,#00b09b,#96c93d);
    box-shadow:0 10px 25px rgba(0,176,155,0.4);
}

/* Scientific */
.scientific{
    background: linear-gradient(135deg,#fc466b,#3f5efb);
    box-shadow:0 10px 25px rgba(63,94,251,0.4);
}

/* Hover Effect */
.links a:hover{
    transform:translateY(-8px) scale(1.05);
    box-shadow:0 18px 35px rgba(255,255,255,0.15);
}

/* Shine Hover */
.links a::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:rgba(255,255,255,0.25);
    transform:skewX(-25deg);
    transition:0.5s;
}

.links a:hover::before{
    left:130%;
}

/* Floating Circles Background */
body::before,
body::after{
    content:"";
    position:absolute;
    border-radius:50%;
    z-index:-1;
}

body::before{
    width:300px;
    height:300px;
    background:rgba(255,255,255,0.05);
    top:-80px;
    left:-80px;
}

body::after{
    width:250px;
    height:250px;
    background:rgba(255,255,255,0.05);
    bottom:-60px;
    right:-60px;
}

/* Animation */
@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Responsive */
@media(max-width:768px){
    .container{
        padding:35px 20px;
    }

    .container h1{
        font-size:32px;
    }

    .links a{
        width:100%;
        max-width:300px;
    }
}
</style>
</head>
<body>

<div class="container">
    <h1>Calculator Hub</h1>
    <p>Select your calculator type</p>

    <div class="links">
        <a href="Simple calculater/index.html" class="simple">Simple Calculator</a>
        <a href="Scientific Calculater/index.html" class="scientific">Scientific Calculator</a>
    </div>
</div>

</body>
</html>
