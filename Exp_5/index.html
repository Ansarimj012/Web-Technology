<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(to right, #4e73df, #1cc88a);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 10px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 8px 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        input:focus, textarea:focus {
            border-color: #4e73df;
            outline: none;
        }

        .gender-group {
            display: flex;
            gap: 15px;
        }

        .buttons {
            margin-top: 15px;
            text-align: center;
        }

        button {
            padding: 8px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
            transition: 0.3s ease;
        }

        .submit-btn {
            background-color: #4e73df;
            color: white;
        }

        .submit-btn:hover {
            background-color: #2e59d9;
        }

        .output {
            margin-top: 20px;
            background: #f8f9fc;
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            white-space: pre-wrap;
            text-align: left;
        }

        .copy-wrapper {
            text-align: center;
            margin-top: 10px;
        }

        .copy-btn {
            background-color: #42b98d;
            color: black;
            font-weight: bold;
        }

        .copy-btn:hover {
            background-color: #2aa876;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Registration Form</h2>
        <form id="registrationForm">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" id="dob" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone">
            </div>

            <div class="form-group">
                <label>Gender</label>
                <div class="gender-group">
                    <label><input type="radio" name="gender" value="Male"> Male</label>
                    <label><input type="radio" name="gender" value="Female"> Female</label>
                </div>
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea rows="3" id="address"></textarea>
            </div>

            <div class="form-group">
                <label>Message</label>
                <textarea rows="3" id="message"></textarea>
            </div>

            <div class="buttons">
                <button type="submit" class="submit-btn">Submit</button>
            </div>

        </form>
    </div>

    <div class="output" id="outputBox">
        Submitted data will appear here...
    </div>

    <div class="copy-wrapper">
        <button type="button" id="copyBtn" class="copy-btn">Copy Data</button>
    </div>

    <script>
        const form = document.getElementById("registrationForm");
        const outputBox = document.getElementById("outputBox");
        const copyBtn = document.getElementById("copyBtn");

        let finalData = "";

        form.addEventListener("submit", function(e) {
            e.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const dob = document.getElementById("dob").value;
            const phone = document.getElementById("phone").value;
            const address = document.getElementById("address").value;
            const message = document.getElementById("message").value;

            const genderElement = document.querySelector('input[name="gender"]:checked');
            const gender = genderElement ? genderElement.value : "Not Selected";

            finalData =
                "Full Name: " + name + "\n" +
                "Email: " + email + "\n" +
                "Password: " + password + "\n" +
                "DOB: " + dob + "\n" +
                "Phone: " + phone + "\n" +
                "Gender: " + gender + "\n" +
                "Address: " + address + "\n" +
                "Message: " + message;

            outputBox.textContent = finalData;
        });

        copyBtn.addEventListener("click", function() {
            if (finalData === "") {
                alert("Please submit the form first!");
                return;
            }

            navigator.clipboard.writeText(finalData)
                .then(() => {
                    alert("Data copied successfully!");
                })
                .catch(() => {
                    alert("Failed to copy data.");
                });
        });
    </script>

</body>
</html>
