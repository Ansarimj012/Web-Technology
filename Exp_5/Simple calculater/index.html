<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Calculator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    overflow:hidden;
}

/* Animated Glow Background */
body::before{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    background:#00f7ff;
    border-radius:50%;
    top:10%;
    left:10%;
    filter:blur(120px);
    opacity:0.4;
}

body::after{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    background:#ff00ff;
    border-radius:50%;
    bottom:10%;
    right:10%;
    filter:blur(120px);
    opacity:0.4;
}

/* Calculator */
.calculator{
    position:relative;
    z-index:1;
    width:370px;
    padding:25px;
    border-radius:25px;
    backdrop-filter:blur(20px);
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 15px 40px rgba(0,0,0,0.35);
}

/* Heading */
.calculator h1{
    text-align:center;
    color:#fff;
    font-size:28px;
    margin-bottom:18px;
    letter-spacing:1px;
}

/* Display */
.display{
    margin-bottom:20px;
}

.display input{
    width:100%;
    height:75px;
    border:none;
    outline:none;
    border-radius:18px;
    padding:15px;
    font-size:34px;
    text-align:right;
    color:#fff;
    background:rgba(255,255,255,0.07);
    box-shadow:inset 0 4px 10px rgba(0,0,0,0.25);
}

/* Buttons */
.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

button{
    height:68px;
    border:none;
    border-radius:18px;
    font-size:24px;
    font-weight:600;
    cursor:pointer;
    color:white;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(8px);
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
    transition:0.25s ease;
}

button:hover{
    transform:translateY(-4px) scale(1.05);
    background:linear-gradient(135deg,#00c6ff,#0072ff);
}

button:active{
    transform:scale(0.95);
}

/* Special Buttons */
.operator{
    background:linear-gradient(135deg,#ff9966,#ff5e62);
}

.equal{
    background:linear-gradient(135deg,#00f260,#0575e6);
}

.clear{
    background:linear-gradient(135deg,#fc466b,#3f5efb);
}

/* Footer */
.footer{
    text-align:center;
    margin-top:18px;
    color:#ddd;
    font-size:14px;
}

/* Responsive */
@media(max-width:420px){
    .calculator{
        width:95%;
        padding:18px;
    }

    button{
        height:60px;
        font-size:22px;
    }

    .display input{
        height:68px;
        font-size:28px;
    }
}
</style>
</head>

<body>

<div class="calculator">
    <h1>Simple Calculator</h1>

    <div class="display">
        <input type="text" id="inputbox" readonly>
    </div>

    <div class="buttons">
        <button class="clear">AC</button>
        <button class="clear">DE</button>
        <button class="operator">%</button>
        <button class="operator">/</button>

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="operator">*</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="operator">-</button>

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="operator">+</button>

        <button>00</button>
        <button>0</button>
        <button>.</button>
        <button class="equal">=</button>
    </div>

</div>

<script>
let display = document.getElementById("inputbox");
let buttons = document.querySelectorAll("button");

let string = "";

buttons.forEach(btn => {
    btn.addEventListener("click", (e) => {
        let value = e.target.innerText;

        if(value === "AC"){
            string = "";
        }
        else if(value === "DE"){
            string = string.slice(0,-1);
        }
        else if(value === "="){
            try{
                string = eval(string).toString();
            }catch{
                string = "Error";
            }
        }
        else{
            string += value;
        }

        display.value = string;
    });
});
</script>

</body>
</html>
