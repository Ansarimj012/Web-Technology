<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
        
    body{
        background: linear-gradient(135deg,#667eea,#764ba2,#6dd5ed);
        background-size:400% 400%;
        animation: gradientBG 10s ease infinite;
        
        display:flex;
        justify-content:center;
        align-items:center;
        flex-direction:column;
        
        min-height:100vh;
        padding:20px;
    }
        
    @keyframes gradientBG{
        0%{background-position:0% 50%;}
        50%{background-position:100% 50%;}
        100%{background-position:0% 50%;}
    }
        
    .container{
        background:#ffffff;
        padding:35px 40px;
        border-radius:15px;
        width:100%;
        max-width:520px;
        box-shadow:0 15px 40px rgba(0,0,0,0.2);
        transition:0.3s;
    }
        
    .container:hover{
        transform:translateY(-3px);
    }
        
    h2{
        text-align:center;
        margin-bottom:25px;
        color:#333;
    }
        
    .form-group{
        margin-bottom:18px;
    }
        
    label{
        display:block;
        margin-bottom:6px;
        font-weight:600;
        font-size:14px;
        color:#444;
    }
        
    input,textarea{
        width:100%;
        padding:10px 12px;
        border-radius:8px;
        border:1px solid #ccc;
        font-size:14px;
        transition:0.3s;
    }
        
    input:focus,textarea:focus{
        border-color:#667eea;
        box-shadow:0 0 5px rgba(102,126,234,0.4);
        outline:none;
    }
        
    .gender-group{
        display:flex;
        gap:20px;
        margin-top:5px;
    }
        
    .buttons{
        margin-top:20px;
        text-align:center;
    }
        
    button{
        padding:10px 22px;
        border:none;
        border-radius:8px;
        cursor:pointer;
        font-size:14px;
        font-weight:600;
        margin:6px;
        transition:0.3s;
    }
        
    .submit-btn{
        background:linear-gradient(135deg,#667eea,#764ba2);
        color:white;
    }
        
    .submit-btn:hover{
        transform:scale(1.05);
        box-shadow:0 5px 15px rgba(0,0,0,0.2);
    }
        
    .output{
        margin-top:25px;
        background:#ffffff;
        padding:18px;
        border-radius:10px;
        width:100%;
        max-width:520px;
        box-shadow:0 10px 25px rgba(0,0,0,0.15);
        white-space:pre-wrap;
        font-size:14px;
    }
        
    .copy-wrapper{
        text-align:center;
        margin-top:12px;
    }
        
    .copy-btn{
        background:linear-gradient(135deg,#1cc88a,#20c997);
        color:white;
    }
        
    .copy-btn:hover{
        transform:scale(1.05);
        box-shadow:0 5px 15px rgba(0,0,0,0.2);
    }
    </style>
</head>

<body>

    <div class="container">
        <h2>Registration Form</h2>
        <form id="registrationForm">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" id="dob" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone">
            </div>

            <div class="form-group">
                <label>Gender</label>
                <div class="gender-group">
                    <label><input type="radio" name="gender" value="Male"> Male</label>
                    <label><input type="radio" name="gender" value="Female"> Female</label>
                </div>
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea rows="3" id="address"></textarea>
            </div>

            <div class="form-group">
                <label>Message</label>
                <textarea rows="3" id="message"></textarea>
            </div>

            <div class="buttons">
                <button type="submit" class="submit-btn">Submit</button>
            </div>

        </form>
    </div>

    <div class="output" id="outputBox">
        Submitted data will appear here...
    </div>

    <div class="copy-wrapper">
        <button type="button" id="copyBtn" class="copy-btn">Copy Data</button>
    </div>

    <script>
        const form = document.getElementById("registrationForm");
        const outputBox = document.getElementById("outputBox");
        const copyBtn = document.getElementById("copyBtn");

        let finalData = "";

        form.addEventListener("submit", function(e) {
            e.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const dob = document.getElementById("dob").value;
            const phone = document.getElementById("phone").value;
            const address = document.getElementById("address").value;
            const message = document.getElementById("message").value;

            const genderElement = document.querySelector('input[name="gender"]:checked');
            const gender = genderElement ? genderElement.value : "Not Selected";

            finalData =
                "Full Name: " + name + "\n" +
                "Email: " + email + "\n" +
                "Password: " + password + "\n" +
                "DOB: " + dob + "\n" +
                "Phone: " + phone + "\n" +
                "Gender: " + gender + "\n" +
                "Address: " + address + "\n" +
                "Message: " + message;

            outputBox.textContent = finalData;
        });

        copyBtn.addEventListener("click", function() {
            if (finalData === "") {
                alert("Please submit the form first!");
                return;
            }

            navigator.clipboard.writeText(finalData)
                .then(() => {
                    alert("Data copied successfully!");
                })
                .catch(() => {
                    alert("Failed to copy data.");
                });
        });
    </script>

</body>
</html>
